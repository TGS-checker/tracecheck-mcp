name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tracecheck-keepalive
      cancel-in-progress: true
    steps:
      - name: Ping Render often enough to avoid a 15-minute free-tier sleep
        run: |
          # GitHub often delays a */10 cron to ~hourly. This job keeps
          # pinging every 7 minutes for ~49 minutes so a delayed next
          # schedule still leaves a gap under Render's 15-minute idle limit.
          URL=https://tracecheck-mcp.onrender.com/health
          for i in 1 2 3 4 5 6 7 8; do
            echo "ping $i $(date -u +%H:%M:%S)Z"
            curl -fsS -m 90 "$URL" || echo "ping $i failed"
            if [ "$i" -lt 8 ]; then sleep 420; fi
          done
